services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./targets:/workspace/targets:ro
      - ./data:/workspace/data
    environment:
      CLANG_BIN: ${CLANG_BIN:-clang}
      MAKE_BIN: ${MAKE_BIN:-make}
      RETRY_CAP: ${RETRY_CAP:-3}
      FUZZ_TIME_SECONDS: ${FUZZ_TIME_SECONDS:-10}
      FUZZ_RUNS: ${FUZZ_RUNS:-100000}
      FUZZ_MAX_INPUT_BYTES: ${FUZZ_MAX_INPUT_BYTES:-256}
      DIFFERENTIAL_FUZZ_RUNS: ${DIFFERENTIAL_FUZZ_RUNS:-2000}
      COMMAND_TIMEOUT_SECONDS: ${COMMAND_TIMEOUT_SECONDS:-30}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL_FAST: ${GROQ_MODEL_FAST:-openai/gpt-oss-20b}
      GROQ_MODEL_STRONG: ${GROQ_MODEL_STRONG:-openai/gpt-oss-20b}
      GROQ_TEMPERATURE: ${GROQ_TEMPERATURE:-0.6}
      GROQ_TOP_P: ${GROQ_TOP_P:-0.95}
      GROQ_MAX_COMPLETION_TOKENS: ${GROQ_MAX_COMPLETION_TOKENS:-4096}
      GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-default}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-claude-3-5-haiku-20241022}
      LLM_MODEL_STRONG: ${LLM_MODEL_STRONG:-claude-sonnet-4-20250514}
      PYTHONDONTWRITEBYTECODE: "1"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
