<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #070d18; }
      .box { fill: #0f172a; stroke: #1e293b; stroke-width: 2; rx: 8; }
      .box-active { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .box-accent { fill: #1e293b; stroke: #f97316; stroke-width: 2; rx: 8; }
      .box-success { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 8; }
      .text-title { fill: #38bdf8; font-family: system-ui, sans-serif; font-size: 16px; font-weight: bold; }
      .text-body { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 12px; }
      .text-sub { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
      .line { stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line-dashed { stroke: #a855f7; stroke-width: 1.5; stroke-dasharray: 4; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Header -->
  <text x="450" y="35" text-anchor="middle" class="text-title" font-size="20">AI KAVACH — Autonomous Cyber-Reasoning Pipeline</text>

  <!-- Stage 1: Build Harness -->
  <rect x="50" y="60" width="220" height="70" class="box-active" />
  <text x="65" y="85" class="text-sub">Stage 1: Build Harness</text>
  <text x="65" y="105" class="text-body">Normal + ASan/UBSan + libFuzzer</text>

  <!-- Stage 2: Discovery -->
  <rect x="340" y="60" width="220" height="70" class="box-active" />
  <text x="355" y="85" class="text-sub">Stage 2: Discovery Engine</text>
  <text x="355" y="105" class="text-body">libFuzzer + Semgrep Static Seeds</text>

  <!-- Stage 3: Context Map -->
  <rect x="630" y="60" width="220" height="70" class="box" />
  <text x="645" y="85" class="text-sub">Stage 3: AST Context Map</text>
  <text x="645" y="105" class="text-body">Call Graph &amp; Function Slices</text>

  <!-- Stage 4: Confirmed PoV -->
  <rect x="340" y="180" width="220" height="70" class="box-accent" />
  <text x="355" y="205" class="text-sub">Stage 4: Confirmed PoV</text>
  <text x="355" y="225" class="text-body">Deterministic Replay Under ASan</text>

  <!-- Stage 5: Tiered Patch Gen -->
  <rect x="340" y="300" width="220" height="90" class="box-active" />
  <text x="355" y="325" class="text-sub">Stage 5: Tiered Patch Gen</text>
  <text x="355" y="345" class="text-body">1. Rules  2. Patch Memory</text>
  <text x="355" y="365" class="text-body">3. Groq Qwen / Llama LLM Fallback</text>

  <!-- Patch Memory -->
  <rect x="630" y="300" width="220" height="90" class="box" />
  <text x="645" y="325" class="text-sub">§5.3 Patch Memory (CBR)</text>
  <text x="645" y="345" class="text-body">Case-Based Precedent Store</text>
  <text x="645" y="365" class="text-body">JSONL / SQLite Storage</text>

  <!-- Stage 6: Verification Suite -->
  <rect x="340" y="440" width="220" height="90" class="box-active" />
  <text x="355" y="465" class="text-sub">Stage 6: Verification (V1-V4)</text>
  <text x="355" y="485" class="text-body">V1 Rebuild | V2 Replay</text>
  <text x="355" y="505" class="text-body">V3 Regression | V4 Diff Re-Fuzz</text>

  <!-- Stage 7: Evidence Report -->
  <rect x="50" y="440" width="220" height="90" class="box-success" />
  <text x="65" y="465" class="text-sub" fill="#6ee7b7">Stage 7: Evidence Report</text>
  <text x="65" y="485" class="text-body" fill="#a7f3d0">Cryptographic PoV &amp; Diffs</text>
  <text x="65" y="505" class="text-body" fill="#a7f3d0">Commander Web Console</text>

  <!-- Flow Arrows -->
  <path d="M 270 95 L 335 95" class="line" />
  <path d="M 450 130 L 450 175" class="line" />
  <path d="M 450 250 L 450 295" class="line" />
  <path d="M 450 390 L 450 435" class="line" />
  <path d="M 340 485 L 275 485" class="line" />

  <!-- Memory Connection -->
  <path d="M 560 330 L 625 330" class="line-dashed" />
  <path d="M 625 360 L 560 360" class="line-dashed" />

  <!-- Retry Loop Line -->
  <path d="M 560 485 L 600 485 L 600 345 L 565 345" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4" fill="none" marker-end="url(#arrow)" />
  <text x="605" y="420" fill="#ef4444" font-family="sans-serif" font-size="11">Retry &lt;= 3</text>
</svg>
